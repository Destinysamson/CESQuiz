<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CES 211 Practice Test (100 Questions)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 650px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #timer-container {
      font-size: 16px;
      font-weight: bold;
      color: #d9534f;
      background: #fdf2f2;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #f5c6cb;
    }

    .question-text {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #f8f9fa;
      border: 1px solid #ced4da;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #e9ecef;
    }

    .option-btn.selected {
      background-color: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
      width: 100%;
    }

    #result-container {
      display: none;
      text-align: center;
    }

    .score-card {
      background: #e9f7ef;
      border: 1px solid #28a745;
      padding: 20px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="quiz-content">
      <div class="header-row">
        <span id="question-count" style="font-weight: bold; color: #555;">Question 1 of 100</span>
        <div id="timer-container">⏱ Time Left: <span id="timer">50:00</span></div>
      </div>

      <div id="question-text" class="question-text">Loading question...</div>

      <div id="options-list" class="options-list"></div>

      <div class="nav-buttons">
        <button id="prev-btn" class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
        <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()">Next</button>
      </div>

      <button class="btn btn-success" onclick="finishQuiz()">Finish Quiz & See Score</button>
    </div>

    <div id="result-container">
      <h2>Quiz Completed! 🎉</h2>
      <div class="score-card">
        <h3 id="result-score" style="margin: 0 0 10px 0; color: #155724;">Your Score: 0%</h3>
        <p id="result-attempts" style="margin: 0; color: #155724;">Total Attempted: 0</p>
      </div>
    </div>
  </div>

  <script>
    // Sample question structure. Ensure 'answer' uses 0-based indexing (0 = A, 1 = B, 2 = C, 3 = D)
    const quizData = [
      {
        question: "An entrepreneur who can recognize an opportunity, take a calculated risk, develop a business model and validate customer needs is demonstrating primarily which combination of competencies?",
        options: [
          "A. Entrepreneurial mindset and practical entrepreneurial skills",
          "B. Traditional employment and administrative competence",
          "C. Financial management and organizational control",
          "D. Technical specialization and bureaucratic competence"
        ],
        answer: 0
      },
      {
        question: "Which of the following best distinguishes adaptability from merely possessing entrepreneurial knowledge?",
        options: [
          "A. Ability to memorize business concepts",
          "B. Ability to adjust to changing circumstances and create opportunities",
          "C. Ability to avoid uncertain situations",
          "D. Ability to maintain an existing business model regardless of circumstances"
        ],
        answer: 1
      },
      {
        question: "The emphasis on entrepreneurship as a career path alongside traditional employment is primarily associated with which objective?",
        options: [
          "A. Resource acquisition",
          "B. Career readiness and adaptability",
          "C. Customer validation",
          "D. Business model development"
        ],
        answer: 1
      }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = {}; 
    let timeLeft = 3000; // 50 minutes in seconds
    let timerInterval;

    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finishQuiz();
        } else {
          timeLeft--;
          let minutes = Math.floor(timeLeft / 60);
          let seconds = timeLeft % 60;
          document.getElementById("timer").innerText = 
            `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
      }, 1000);
    }

    function loadQuestion() {
      const q = quizData[currentQuestionIndex];
      document.getElementById("question-count").innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
      document.getElementById("question-text").innerText = `${currentQuestionIndex + 1}. ${q.question}`;
      
      const optionsContainer = document.getElementById("options-list");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;

        if (userAnswers[currentQuestionIndex] === index) {
          btn.classList.add("selected");
        }

        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });

      document.getElementById("prev-btn").style.visibility = currentQuestionIndex === 0 ? "hidden" : "visible";
      document.getElementById("next-btn").style.visibility = currentQuestionIndex === quizData.length - 1 ? "hidden" : "visible";
    }

    function selectOption(index) {
      userAnswers[currentQuestionIndex] = index;
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach((btn, i) => {
        btn.classList.toggle("selected", i === index);
      });
    }

    function nextQuestion() {
      if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
      }
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      let score = 0;
      
      quizData.forEach((q, index) => {
        if (userAnswers[index] === q.answer) {
          score++;
        }
      });

      const totalQuestions = quizData.length;
      const attemptedCount = Object.keys(userAnswers).length;
      const percentage = Math.round((score / totalQuestions) * 100);

      document.getElementById("quiz-content").style.display = "none";
      document.getElementById("result-container").style.display = "block";
      
      document.getElementById("result-score").innerText = `Your Score: ${percentage}% (${score} / ${totalQuestions})`;
      document.getElementById("result-attempts").innerText = `Total Attempted: ${attemptedCount} of ${totalQuestions}`;
    }

    // Initialize Quiz
    loadQuestion();
    startTimer();
  </script>
</body>
</html>
